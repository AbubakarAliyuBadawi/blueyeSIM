############################################################################
# DUNE flying LAUV Marie in Stonefish                                      #
#                                                                          #
# DUNE's LAUV simulator (lauv-simulator-1) with its own vehicle physics    #
# switched off: the vehicle's motion comes from Stonefish, through the     #
# dune_bridge node of lauv_marie_control, as IMC SimulatedState. DUNE's    #
# simulated sensors, navigation, control, manoeuvres and supervisors run   #
# as on the vehicle, and its fin and propeller commands go to Stonefish.   #
#                                                                          #
# Run from the DUNE folder (lauv_marie_dune.launch.py copies this file to  #
# its etc/ folder):  ./dune -c lauv-marie-stonefish -p Simulation          #
############################################################################

[Require lauv-simulator-1.ini]

# The vehicle's motion comes from Stonefish, not from DUNE's own model
[Simulators.VSIM]
Enabled                                 = Never

# Water depth of DUNE's simulated sea (DVL altitude, echo sounder) outside
# its bathymetry map, the same as the seabed of the Stonefish scenario
# (lauv_marie_control/dune/stonefish_start.yaml)
[Simulators.Environment]
Out Of Bounds Depth                     = 100.0

# Marie's depth and roll gains, from the Config.ini of her logs of
# 7-8 September 2026. Her other attitude, allocator, speed and diving
# settings are those of the simulator already.
[Control.AUV.Attitude]
Depth PID Gains                         = 0.40, 0.05, 0.60
Depth Integral Limit                    = 0.08
Roll PID Gains                          = 0.4, 0.0, 0.02

# A second UDP link, for the bridge only: it sends the vehicle state to
# port 6971 and receives the actuator commands on 6970. Neptus and other
# consoles use the usual link (port 6002) as with any DUNE.
[Transports.UDP/Stonefish]
Enabled                                 = Always
Entity Label                            = UDP Stonefish
Activation Time                         = 0
Deactivation Time                       = 0
Debug Level                             = None
Execution Priority                      = 10
Announce Service                        = false
Contact Refresh Periodicity             = 5.0
Contact Timeout                         = 30
Dynamic Nodes                           = false
Local Messages Only                     = true
Local Port                              = 6971
Print Incoming Messages                 = 0
Print Outgoing Messages                 = 0
Static Destinations                     = 127.0.0.1:6970
Transports                              = EstimatedState,
                                          PlanControl,
                                          PlanControlState,
                                          Rpm,
                                          SetServoPosition,
                                          VehicleState
